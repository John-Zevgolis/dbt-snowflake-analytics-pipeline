models:
  - name: stg_order_items
    config:
      contract:
        enforced: true
    description: 'Staged table for items.'
    columns:
      - name: item_id
        description: 'Primary key for the order item.'
        data_type: string
        tests:
          - unique
          - not_null
      - name: order_id
        description: 'Foreign key linking to the order.'
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: 'Foreign key linking to the product.'
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
