models:
  - name: stg_orders
    config:
      contract:
        enforced: true
    description: 'Staged table for orders.'
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'subtotal + tax_paid = order_total'
    columns:
      - name: order_id
        description: 'Primary key for the order.'
        data_type: string
        tests:
          - unique
          - not_null
      - name: customer_id
        description: 'Foreign key linking to the customer who placed the order.'
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: ordered_at
        description: 'Timestamp of when the order was placed.'
        data_type: timestamp
        tests:
          - not_null
      - name: store_id
        description: 'Foreign key linking to the store where the order was placed.'
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: subtotal
        description: 'Subtotal amount of the order before taxes.'
        data_type: numeric(10,2)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: tax_paid
        description: 'Tax amount paid for the order.'
        data_type: numeric(10,2)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: order_total
        description: 'Total amount of the order including subtotal and tax.'
        data_type: numeric(10,2)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
