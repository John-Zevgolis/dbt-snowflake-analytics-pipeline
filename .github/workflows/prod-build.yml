name: Prod deploy (on merge to main / manual)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Production deps and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.10
      - run: uv sync

      - name: Create profiles.yml from Secret
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_CONTENT }}" > ~/.dbt/profiles.yml

      - name: Install dbt dependencies
        run: dbt deps --target prod

      - name: Run dbt build for prod
        run: dbt build --target prod

      - name: Upload prod target as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-target
          path: target/
          retention-days: 90
